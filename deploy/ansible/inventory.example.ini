# Copy to inventory.ini and fill in. SSH key auth + passwordless sudo assumed.

# ---- TWO PIs (reference layout) ----
[orchestrator]
pi-orchestrator ansible_host=192.168.1.2 ansible_user=pi

[worker]
pi-worker ansible_host=192.168.1.3 ansible_user=pi

# ---- ONE PI (orchestrator + worker on the same board) ----
# Replace the two blocks above with the SAME host in both groups, and set
# scangrid_orchestrator_url=http://127.0.0.1:8090 below. Each systemd unit
# pins its own role, so one shared env file is correct.
# [orchestrator]
# pi-scangrid ansible_host=192.168.1.2 ansible_user=pi
# [worker]
# pi-scangrid ansible_host=192.168.1.2 ansible_user=pi

# ---- MANY WORKERS ----
# Add more lines under [worker], each a distinct host. They all share the
# token + allowlist below and poll the one orchestrator.

[scangrid:children]
orchestrator
worker

[scangrid:vars]
scangrid_api_token=CHANGE_ME_32_BYTES_HEX

# The ONLY ranges any worker may scan. CIDRs / IPs / a.b.c.d-e, comma separated.
scangrid_allowlist=192.168.1.0/24
scangrid_allow_public_targets=false

scangrid_orchestrator_url=http://192.168.1.2:8090

# CVE matching: nvd_api | offline | none
scangrid_cve_provider=nvd_api
scangrid_nvd_api_key=

# Notifications: none | log | ntfy | telegram | webhook
scangrid_notify_backend=log
scangrid_ntfy_topic=

scangrid_repo_url=https://github.com/gorkemguler/scan-grid.git
scangrid_ref=main
